name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  collapse:
    name: 折叠功能回归测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 运行单元测试（无需浏览器与依赖）
        run: node test/collapse.test.mjs
